{{- if .Values.m3.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onai-three-node.m3.fullname" . }}
  labels:
    {{- include "onai-three-node.m3.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.m3.replicaCount }}
  selector:
    matchLabels:
      {{- include "onai-three-node.m3.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.m3.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "onai-three-node.m3.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "onai-three-node.serviceAccountName" . }}
      {{- with .Values.m3.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: m3-gateway
          {{- with .Values.m3.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.m3.image.repository }}:{{ .Values.m3.image.tag }}"
          imagePullPolicy: {{ .Values.m3.image.pullPolicy }}
          {{- with .Values.m3.command }}
          stdin: True
          tty: True
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.m3.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: internal
              containerPort: {{ .Values.m3.service.internalPort }}
              protocol: TCP
            {{- if .Values.m3.service.externalEnabled }}
            - name: external
              containerPort: {{ .Values.m3.service.externalPort }}
              protocol: TCP
            {{- end }}
          env:
            - name: INTERNAL_PORT
              value: {{ .Values.m3.env.INTERNAL_PORT | quote }}
            - name: EXTERNAL_PORT
              value: {{ .Values.m3.env.EXTERNAL_PORT | quote }}
            - name: M1_HOST
              value: {{ .Values.m3.env.M1_HOST | default (include "onai-three-node.m1.internalHost" .) | quote }}
            - name: M1_HTTP_PORT
              value: {{ .Values.m3.env.M1_HTTP_PORT | quote }}
            - name: M2_HOST
              value: {{ .Values.m3.env.M2_HOST | default (include "onai-three-node.m2.internalHost" .) | quote }}
            - name: M2_PORT
              value: {{ .Values.m3.env.M2_PORT | quote }}
            - name: NODE_ROLE
              value: {{ .Values.m3.env.NODE_ROLE | quote }}
            {{- range .Values.m3.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- with .Values.m3.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.m3.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.m3.ssd.enabled }}
            - name: m3-ssd
              mountPath: {{ .Values.m3.ssd.mountPath }}
            {{- end }}
            {{- if .Values.m3.persistence.enabled }}
            - name: m3-data
              mountPath: {{ .Values.m3.persistence.mountPath }}
            {{- end }}
      volumes:
        {{- if .Values.m3.ssd.enabled }}
        - name: m3-ssd
          persistentVolumeClaim:
            claimName: {{ include "onai-three-node.m3.fullname" . }}-ssd
        {{- end }}
        {{- if .Values.m3.persistence.enabled }}
        - name: m3-data
          persistentVolumeClaim:
            claimName: {{ include "onai-three-node.m3.fullname" . }}-data
        {{- end }}
      {{- with .Values.m3.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.m3.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.m3.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: {{ include "onai-three-node.fullname" . }}-gateway
  labels:
    {{- include "onai-three-node.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
    - name: http
      port: {{ .Values.gateway.listeners.http.port }}
      protocol: {{ .Values.gateway.listeners.http.protocol }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if and .Values.gateway.listeners.https .Values.gateway.listeners.https.certificateRef.name }}
    - name: https
      port: {{ .Values.gateway.listeners.https.port }}
      protocol: {{ .Values.gateway.listeners.https.protocol }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateway.listeners.https.certificateRef.name }}
            {{- if .Values.gateway.listeners.https.certificateRef.namespace }}
            namespace: {{ .Values.gateway.listeners.https.certificateRef.namespace }}
            {{- end }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
---
# HTTPRoute: routes HTTP traffic to M1
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ include "onai-three-node.fullname" . }}-http-route
  labels:
    {{- include "onai-three-node.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "onai-three-node.fullname" . }}-gateway
  {{- with .Values.gateway.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.gateway.httpRoute.httpsRedirect }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "onai-three-node.m1.fullname" . }}
          port: {{ .Values.m1.service.httpPort }}
    {{- range .Values.gateway.httpRoute.rules }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}

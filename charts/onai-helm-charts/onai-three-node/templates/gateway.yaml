{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "onai-three-node.m1.fullname" . }}
  labels:
    {{- include "onai-three-node.m1.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range .Values.gateway.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
    {{- end }}
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.path }}
      backendRefs:
        - name: {{ include "onai-three-node.m1.fullname" . }}
          port: {{ .Values.m1.service.httpPort }}
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: {{ include "onai-three-node.m1.fullname" . }}
  labels:
    {{- include "onai-three-node.m1.labels" . | nindent 4 }}
spec:
  default:
    timeoutSec: {{ .Values.gateway.timeoutSec | default 600 }}
    connectionDraining:
      drainingTimeoutSec: {{ .Values.gateway.connectionDrainingTimeoutSec | default 60 }}
  targetRef:
    group: ""
    kind: Service
    name: {{ include "onai-three-node.m1.fullname" . }}
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ include "onai-three-node.m1.fullname" . }}
  labels:
    {{- include "onai-three-node.m1.labels" . | nindent 4 }}
spec:
  default:
    checkIntervalSec: {{ .Values.gateway.healthCheck.checkIntervalSec | default 10 }}
    timeoutSec: {{ .Values.gateway.healthCheck.timeoutSec | default 5 }}
    healthyThreshold: {{ .Values.gateway.healthCheck.healthyThreshold | default 2 }}
    unhealthyThreshold: {{ .Values.gateway.healthCheck.unhealthyThreshold | default 2 }}
    config:
      type: HTTP
      httpHealthCheck:
        port: {{ .Values.m1.service.httpPort }}
        requestPath: {{ .Values.gateway.healthCheckPath | default .Values.gateway.path }}
  targetRef:
    group: ""
    kind: Service
    name: {{ include "onai-three-node.m1.fullname" . }}
{{- end }}

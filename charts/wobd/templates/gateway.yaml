{{ if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "wobd.fullname" . }}
spec:
  parentRefs:
    {{ range .Values.gateway.parentRefs  }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
    {{  end }}
  hostnames:
  - {{ .Values.gateway.host }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.gateway.path }}
    timeouts:
      request: {{ .Values.gateway.timeoutSec | default 600 }}s
      backendRequest: {{ .Values.gateway.timeoutSec | default 600 }}s
    backendRefs:
    - name: {{ include "wobd.fullname" . }}
      port: {{ .Values.service.port }}
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: {{ include "wobd.fullname" . }}
spec:
  default:
    timeoutSec: {{ .Values.gateway.timeoutSec | default 600 }}
  targetRef:
    group: ""
    kind: Service
    name: {{ include "wobd.fullname" . }}
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ include "wobd.fullname" . }}
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 2
    config:
      type: HTTP
      httpHealthCheck:
        port: {{ .Values.service.port }}
        requestPath: {{ .Values.gateway.healthCheckPath | default .Values.gateway.path }}
  targetRef:
    group: ""
    kind: Service
    name: {{ include "wobd.fullname" . }}
{{ end }}
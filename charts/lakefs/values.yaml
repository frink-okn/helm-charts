# Default values for lakefs.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
postgresql:
  global:
    security:
      allowInsecureImages: True
  image:
    registry: containers.renci.org
    repository: bitnami/postgresql
    tag: 17.6.0-debian-12-r4
  auth:
    enablePostgresUser: false
    existingSecret: "postgres-secret"
    username: "lakefs"
    database: "lakefs"
  primary:
    resources:
      limits:
        ephemeral-storage: 1Gi
        memory: 2Gi
        cpu: 1

lakefs:
  # Default values for lakefs.
  # This is a YAML-formatted file.
  # Declare variables to be passed into your templates.
  replicaCount: 1
  storageLocation: "s3"
  image:
    repository: treeverse/lakefs
    pullPolicy: Always

  ingress:
    enabled: false
    annotations:
      {}
    ingressClassName: ""
    defaultBackend: {}
    hosts: []
#      - host: ""
#        paths:
#          - "/"
#        # redirect to a different service based on path prefix for advanced use cases only
#        # pathsOverrides:
#        #   - path: /some/path
#        #     serviceName: other-example.local
#        #     servicePort: 80
#    tls:
#     - secretName: ""
#       hosts:
#         - ""
  resources:
    limits:
      memory: 2Gi
      cpu: 1
      ephemeral-storage: 1Gi

  s3Fallback:
    enabled: false
    
  committedLocalCacheVolume:
    enabled: False
    name: committed-local-cache
    storageClassName: "basic"
    persistentVolumeClaim:
      claimName: committed-local-cache
    size: 1Gi
  dataVolume:
    enabled: False
    name: "lakefs-local-data"
    size: 1500Gi
    storageClassName: "basic"

  secrets:
    authEncryptSecretKey:  ""
    databaseConnectionString: postgres://lakefs:lakefs@lakefs-postgresql:5432/lakefs?sslmode=disable
  lakefsConfig: { }
        

#
#blockstore:
#  type: local
#  local:
#    path: "/data"

  useDevPostgres: false

  extraVolumeMounts:
  - mountPath: /data
    name: lakefs-local-data
#  extraVolumes:
#  - name: lakefs-local-data
#    persistentVolumeClaim:
#       # same as lakfs.dataVolume.name
#      claimName: lakefs-local-data
#  - name: committed-local-cache
#    persistentVolumeClaim:
#      # same as lakfs.dataVolume.name
#      claimName: committed-local-cache
cache_size: 10Gi


lakefs-acl:
  service:
    type: ClusterIP
    port: 9000
  # ACL Server Specific Configuration
  acl:
    # Database connection string (default matches docker-compose for dev)
    # In prod, this should point to a real Postgres or persistent volume
    databaseConnectionString: "sqlite:////data/acl.db"
    # Secret Management
    secrets:
      create: true # If true, creates a Secret resource with the values below
      name: ""     # If set, uses this existing secret name instead of creating one
    # Secrets (will be base64 encoded by the chart if create=true)
    apiToken: "super-secret-token"
    encryptionKey: "G0lMOOHFOfb8oUUzLZxHlhjRKryUQQvchzwhBg-kTm4="

    # Persistence for SQLite (optional, if using SQLite)
    persistence:
      enabled: true
      size: 1Gi
      accessMode: ReadWriteOnce